# main 에 push 하면 GitHub Pages 로 배포한다.
# 빌드 단계가 없는 정적 사이트라 저장소를 그대로 올린다.
# configure-pages 의 enablement 가 Pages 를 켜주므로 저장소 설정을 따로 만질 필요가 없다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # .git 과 .github 는 액션이 알아서 뺀다. data/raw 는 .gitignore 라 애초에 없다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
