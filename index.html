<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d0d0f">
<title>한글 워들 — 단어 퍼즐</title>
<link rel="stylesheet" href="css/style.css?v=20260827e">
<!-- 첫 페인트 전에 테마를 정한다. 늦으면 어두운 화면이 한 번 번쩍인다. -->
<script src="js/theme.js?v=20260827e"></script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="side">
      <button class="icon" id="btn-new" type="button" aria-label="새 단어">↻</button>
      <button class="icon" id="btn-scoreboard" type="button" aria-label="스코어보드">♛</button>
    </div>
    <h1 id="title">오늘의 단어</h1>
    <div class="side end">
      <button class="icon" id="btn-theme" type="button" aria-label="화면 테마">☾</button>
      <button class="icon" id="btn-help" type="button" aria-label="규칙 보기">⋯</button>
    </div>
  </header>

  <nav class="lengths" id="lengths" aria-label="자모 개수 선택"></nav>

  <div class="statusbar">
    <span class="timer" id="timer">0:00</span>
  </div>

  <main class="board-wrap">
    <div class="board" id="board"></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="bottom">
    <div class="keyboard" id="keyboard"></div>
    <div class="actions">
      <button class="hint-btn" id="btn-hint" type="button" aria-label="힌트 보기">힌트</button>
      <button class="submit" id="btn-submit" type="button">글자를 입력하세요</button>
    </div>
  </footer>

</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <button class="sheet-close" id="sheet-close" type="button" aria-label="닫기">×</button>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<!--
  캐시 무효화. 아래 ?v= 값은 전부 같아야 하며, js/dict.js 가 data/*.js 에 붙이는
  값도 APP_VERSION 을 통해 여기서 온다. 배포할 때 한 번에 올린다.
-->
<script>window.APP_VERSION = '20260827e';</script>
<script src="js/store.js?v=20260827e"></script>
<script src="js/jamo.js?v=20260827e"></script>
<script src="js/dict.js?v=20260827e"></script>
<script src="js/game.js?v=20260827e"></script>
<script src="js/scoreboard.js?v=20260827e"></script>
<script src="js/ui-sheet.js?v=20260827e"></script>
<script src="js/ui-share.js?v=20260827e"></script>
<script src="js/ui-board.js?v=20260827e"></script>
<script src="js/define.js?v=20260827e"></script>
<script src="js/ui-score.js?v=20260827e"></script>
<script src="js/ui-hint.js?v=20260827e"></script>
<script src="js/ui-compose.js?v=20260827e"></script>
<script src="js/ui.js?v=20260827e"></script>
</body>
</html>
